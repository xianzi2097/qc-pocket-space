<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="google" value="notranslate" />
        <link rel="shortcut icon" href="static/favicon.ico" />
        <title>Scratch 4.0 GUI: Compatibility Testing</title>
    <script defer src="compatibilitytesting.js"></script></head>
    <body>
        <div
            id="cloud-loading"
            style="
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                color: #fff;
                font-family: &quot;Segoe UI&quot;, system-ui, sans-serif;
            "
        >
            <style>
                .qc-loader {
                    position: relative;
                    width: 120px;
                    height: 90px;
                    margin: 0 auto;
                }
                .qc-loader:before {
                    content: '';
                    position: absolute;
                    bottom: 30px;
                    left: 50px;
                    height: 30px;
                    width: 30px;
                    border-radius: 50%;
                    background: #2a9d8f;
                    animation: qc-bounce 0.5s ease-in-out infinite alternate;
                }
                .qc-loader:after {
                    content: '';
                    position: absolute;
                    right: 0;
                    top: 0;
                    height: 7px;
                    width: 45px;
                    border-radius: 4px;
                    box-shadow: 0 5px 0 #f2f2f2, -35px 50px 0 #f2f2f2, -70px 95px 0 #f2f2f2;
                    animation: qc-step 1s ease-in-out infinite;
                }
                @keyframes qc-bounce {
                    0% { transform: scale(1, 0.7); }
                    40% { transform: scale(0.8, 1.2); }
                    60% { transform: scale(1, 1); }
                    100% { bottom: 140px; }
                }
                @keyframes qc-step {
                    0% { box-shadow: 0 10px 0 rgba(0,0,0,0), 0 10px 0 #f2f2f2, -35px 50px 0 #f2f2f2, -70px 90px 0 #f2f2f2; }
                    100% { box-shadow: 0 10px 0 #f2f2f2, -35px 50px 0 #f2f2f2, -70px 90px 0 #f2f2f2, -70px 90px 0 rgba(0,0,0,0); }
                }
            </style>
            <div class="qc-loader"></div>
            <p
                id="cloud-loading-text"
                style="color: #a0a0c0; font-size: 0.95rem; margin-top: 16px"
            >
                青橙加载中...
            </p>
        </div>
    </body>
</html>
